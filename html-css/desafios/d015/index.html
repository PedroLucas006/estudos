<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
    
    * {
      box-sizing: border-box;
      padding: 0px;
      margin: 0px;
    }
    
    #container {
      width: 100vw;
      height: 100vh;
      display: Grid;
      grid-template: 1fr 1fr 2fr 1fr / 3fr 1fr;
    }
    
    .caixa {
      border: 1px solid black;
    }
    
    header {
      grid-area: 1 / 1 / 2 / -1;
      
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    nav {
      grid-area: 2 / 1 / 3 / -1;
      
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #principal {
      grid-area: 3 / 1 / 4 / 2;
      
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #secundario {
      grid-area: 3 / 2 / 4 / 3;
      
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    footer {
      grid-area: -2 / 1 / -1 / -1;
      
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    </style>
</head>
<body>
  <div id="container">
    <header class="caixa">
      <h1>Topo</h1>
    </header>
    
    <nav class="caixa">
      <h2>Menu</h2>
    </nav>
    
    <section class="caixa" id="principal">
      <h2>Principal</h2>
    </section>
    
    <aside class="caixa" id="secundario">
      <h2>Secundário</h2>
    </aside>
    
    <footer class="caixa">
      <h2>Rodapé</h2>
    </footer>
  </div>
</body>
</html>
