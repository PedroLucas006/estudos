<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
      .conteiner {
        background: lightsalmon;
        display: flex;
        flex-flow: row wrap;
      }
      
      .item {
        background: lightblue;
        border: 1px solid black;
        flex-basis: 180px;
        text-align: center;
      }
      
    </style>
</head>
<body>
  <div class="conteiner">
    <div class="item">a</div>
    <div class="item">conteúdo grande.</div>
    <div class="item">conteúdo maior ainda.</div>
    <div class="item">conteúdo muito grande, que ocupa muito espaço.</div>
    <div class="item">e</div>
  </div>
</body>
</html>
